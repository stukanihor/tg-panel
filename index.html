<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Архив документов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Номер сборки в адресах файлов. Telegram кеширует мини-приложение
     целиком, и смены адреса самой страницы не всегда хватает: скрипты
     он берёт из кеша. Пока номер не изменился — файлы те же; изменился
     — браузер обязан скачать заново. Номер меняется при каждой правке
     и виден внизу вкладки «Вопрос», чтобы можно было сверить. -->
<link rel="stylesheet" href="style.css?b=16">
</head>
<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <g id="i-clock" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
    <g id="i-folder" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g>
    <g id="i-ask" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M9.4 9.3a2.7 2.7 0 1 1 3.4 3.4c-.5.2-.8.7-.8 1.2v.4"/>
      <circle cx="12" cy="17" r=".7" fill="currentColor" stroke="none"/></g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/></g>
    <g id="i-search" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></g>
    <g id="i-chev" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 6 6 6-6 6"/></g>
    <g id="i-down" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/></g>
    <g id="i-up" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></g>
    <g id="i-link" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 11a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 0 0 5.7 5.7l1-1"/>
      <path d="M10 13a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7l-1 1"/></g>
    <g id="i-doc" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></g>
    <g id="i-id" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/>
      <path d="M6 16c.6-1.3 1.7-2 3-2s2.4.7 3 2M15 10h3M15 13.5h3"/></g>
    <g id="i-shield" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 5 6v5.5c0 4.2 2.9 7.6 7 9.5 4.1-1.9 7-5.3 7-9.5V6z"/></g>
    <g id="i-heart" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20s-7-4.3-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.7-7 9-7 9z"/></g>
    <g id="i-euro" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16.5 6.5A6 6 0 0 0 7 11v2a6 6 0 0 0 9.5 4.5M4.5 11h7M4.5 14h7"/></g>
    <g id="i-case" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/></g>
    <g id="i-car" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 16v2M19 16v2M4 15l1.4-5A2 2 0 0 1 7.3 8.5h9.4a2 2 0 0 1 1.9 1.5L20 15"/>
      <rect x="3" y="15" width="18" height="2.5" rx="1"/></g>
    <g id="i-home" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4 10 8-6 8 6v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M10 20.5v-6h4v6"/></g>
    <g id="i-umbrella" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 12a8.5 8.5 0 0 1 17 0z"/><path d="M12 12v6.5a2 2 0 0 0 4 0"/></g>
    <g id="i-users" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="9" r="3"/><path d="M3.5 19c.6-3 2.9-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/>
      <path d="M16 6.5a3 3 0 0 1 0 5.5M17.5 19c-.2-1.5-.7-2.7-1.5-3.6"/></g>
    <g id="i-dots" fill="currentColor" stroke="none">
      <circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></g>
    <g id="i-grid" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/>
      <rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></g>
    <g id="i-rows" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="5" width="16" height="6" rx="1.6"/><rect x="4" y="13" width="16" height="6" rx="1.6"/></g>
    <g id="i-lines" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16M4 12h16M4 17h16"/></g>
    <g id="i-bin" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/>
      <path d="M6.5 7l.8 11.6A1.5 1.5 0 0 0 8.8 20h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/>
      <path d="M10.5 11v5M13.5 11v5"/></g>
    <g id="i-check" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12.5 4.5 4.5L19 7.5"/></g>
    <g id="i-star" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 3.9 2.55 5.17 5.7.83-4.12 4.02.97 5.68L12 16.92l-5.1 2.68.97-5.68L3.75 9.9l5.7-.83z"/></g>
    <g id="i-dl" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v10"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19h14"/></g>
    <g id="i-share" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15V4"/><path d="m8 7.5 4-3.5 4 3.5"/>
      <path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></g>
    <g id="i-edit" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"/><path d="m14.5 6.5 3 3"/></g>
    <g id="i-move" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <path d="M10 13h6"/><path d="m13.5 10.5 2.5 2.5-2.5 2.5"/></g>
    <g id="i-bank" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10h16M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18M12 3.5 20 8H4z"/></g>
  </defs>
</svg>

<div class="head">
  <h1 id="title">Сроки</h1>
  <p id="subtitle">Загружаю архив…</p>
</div>

<main id="scroll">

<section class="screen on" id="s-deadlines">
  <div id="stats"></div>
  <div id="deadlines"></div>
</section>

<section class="screen" id="s-archive">
  <div class="search">
    <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
    <input id="q" placeholder="Название, организация, номер…" autocomplete="off">
  </div>
  <div class="bar">
    <div class="crumbs" id="crumbs"></div>
    <button class="iconbtn" id="zipTop" hidden aria-label="Скачать архив">
      <svg viewBox="0 0 24 24"><use href="#i-dl"/></svg></button>
    <div class="views" id="views" hidden>
      <button data-v="grid"    aria-label="Плитка"><svg viewBox="0 0 24 24"><use href="#i-grid"/></svg></button>
      <button data-v="list"    aria-label="Список"><svg viewBox="0 0 24 24"><use href="#i-rows"/></svg></button>
      <button data-v="compact" aria-label="Компактно"><svg viewBox="0 0 24 24"><use href="#i-lines"/></svg></button>
    </div>
  </div>
  <div id="list"></div>
</section>

<section class="screen" id="s-ask">
  <div id="thread"></div>
  <textarea id="question" placeholder="Например: на сколько могут поднять аренду по договору?"></textarea>
  <button class="btn primary" id="send">Спросить</button>
  <div class="chips" id="chips"></div>
  <div class="build">сборка 16</div>
</section>

<section class="screen" id="s-add">
  <div id="addStart">
    <label class="drop">
      <span class="ring"><svg viewBox="0 0 24 24"><use href="#i-up"/></svg></span>
      <b>Выбрать фото или PDF</b>
      <span>Несколько снимков одного документа склею в один файл.<br>До 8 МБ на файл.</span>
      <input type="file" id="file" accept="image/*,application/pdf" multiple hidden>
    </label>
    <label class="drop mini">
      <b>Загрузить пачкой</b>
      <span>Разные документы сразу — каждый файл отдельной записью.<br>До 10 файлов за раз.</span>
      <input type="file" id="bulk" accept="image/*,application/pdf" multiple hidden>
    </label>
  </div>
  <div id="addBody"></div>
</section>

</main>

<div class="tray" id="tray" hidden></div>
<div class="toast" id="toast" hidden></div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<nav>
  <button class="on" data-s="deadlines"><svg viewBox="0 0 24 24"><use href="#i-clock"/></svg>Сроки</button>
  <button data-s="archive"><svg viewBox="0 0 24 24"><use href="#i-folder"/></svg>Архив</button>
  <button data-s="ask"><svg viewBox="0 0 24 24"><use href="#i-ask"/></svg>Вопрос</button>
  <button data-s="add"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>Добавить</button>
</nav>

<script src="app.js?b=16"></script>
<script src="bulk.js?b=16"></script>
<script src="fx.js?b=16"></script>
<script src="scan.js?b=16"></script>
<script src="shell.js?b=16"></script>
</body>
</html>
